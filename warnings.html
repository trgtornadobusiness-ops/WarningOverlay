<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRG WarningOverlay — Warnings</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header class="topbar">
<div class="brand">TRG WARNINGOVERLAY</div>
<nav class="tabs"><a class="tab" href="index.html">ACTIVE ALERTS</a><a class="tab active" href="warnings.html">WARNINGS</a></nav>
<div class="live"><span id="liveDot"></span><span id="status">CONNECTING</span></div>
</header>
<main><section id="warnings" class="warning-list"></section><div id="empty" class="empty hidden"><div class="check">✓</div><div>NO ACTIVE WARNINGS</div><small>Monitoring the National Weather Service</small></div></main>
<section id="newAlert" class="new-alert hidden"><div id="newStripe" class="new-stripe"></div><div class="new-inner"><div class="new-label">NEW WARNING</div><div id="newEvent" class="new-event"></div><div id="newArea" class="new-area"></div><div id="newTime" class="new-time"></div></div></section>
<footer><span id="count">0 ACTIVE WARNINGS</span><span>NATIONAL WEATHER SERVICE DATA</span><span id="updated">UPDATED --</span></footer>
</div>
<script>
const API="https://api.weather.gov/alerts/active",REFRESH=30000,NEW_MS=5*60*1000;
const ALLOWED=new Set(["Tornado Warning","Severe Thunderstorm Warning"]);
const priority={"Tornado Warning":1,"Severe Thunderstorm Warning":2};
const colors={"Tornado Warning":"#ef4444","Severe Thunderstorm Warning":"#f97316"};
let alerts=[],oldIds=new Set(),timer=null,popupTimer=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
function dt(v){const d=new Date(v||0);return Number.isNaN(d.getTime())?"Unknown":d.toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}
function sort(a){return [...a].sort((x,y)=>{const p=priority[x.properties?.event]||9,q=priority[y.properties?.event]||9;return p-q||new Date(y.properties?.sent||0)-new Date(x.properties?.sent||0)})}
function render(){const list=sort(alerts).filter(f=>{const e=new Date(f.properties?.expires||0).getTime();return !Number.isFinite(e)||e>Date.now()});alerts=list;$('warnings').innerHTML='';$('empty').classList.toggle('hidden',list.length>0);$('count').textContent=`${list.length} ACTIVE WARNING${list.length===1?'':'S'}`;for(const f of list){const p=f.properties||{},a=colors[p.event]||'#64748b',el=document.createElement('article');el.className='warning-card';el.style.setProperty('--accent',a);el.innerHTML=`<div class="warning-stripe"></div><div class="warning-content"><div class="warning-badge">${esc(p.event)}</div><div class="warning-event">${esc(p.event)}</div><div class="warning-area">${esc(p.areaDesc||'Area unavailable')}</div><div class="warning-time">Issued ${dt(p.sent||p.effective)} · Expires ${dt(p.expires)}</div><div class="warning-headline">${esc(p.headline||'NWS warning active.')}</div></div>`;$('warnings').appendChild(el)}}
function showNew(f){const p=f.properties||{},a=colors[p.event]||'#64748b';$('newAlert').style.setProperty('--new-accent',a);$('newStripe').style.background=a;$('newEvent').textContent=p.event||'NEW WARNING';$('newArea').textContent=p.areaDesc||'Area unavailable';$('newTime').textContent=`Issued ${dt(p.sent||p.effective)} · Expires ${dt(p.expires)}`;$('newAlert').classList.remove('hidden');clearTimeout(popupTimer);popupTimer=setTimeout(()=>$('newAlert').classList.add('hidden'),9000)}
async function load(){try{const r=await fetch(API,{cache:'no-store',headers:{Accept:'application/geo+json'}});if(!r.ok)throw Error(r.status);const d=await r.json(),next=(d.features||[]).filter(f=>ALLOWED.has(f.properties?.event));const ids=new Set(alerts.map(f=>f.id)),fresh=sort(next).filter(f=>!ids.has(f.id));if(alerts.length&&fresh.length)showNew(fresh[0]);alerts=next;render();$('status').textContent='LIVE';$('liveDot').classList.add('on');$('updated').textContent=`UPDATED ${new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'})}`)}catch(e){$('status').textContent='CONNECTION ISSUE';$('liveDot').classList.remove('on')}clearTimeout(timer);timer=setTimeout(load,REFRESH)}load();
</script>
</body>
</html>
